# =====================================================================
# Register node configuration (one executable = one register, one file
# per deployed node). Encoding: ISO-8859-1, the java.util.Properties
# historical charset - keep non-ASCII out of new keys.
#
# ABSENCE-MEANS-OFF pattern: several features activate by the mere
# presence of their URL key and stay silent without it -
#   pos.sync.store-url        -> store consolidation push (phase 5)
#   pos.valuation.url         -> remote valuation engine (phase 7)
# The store node and a standalone dev register simply omit them.
#
# COMMISSIONING CHECKLIST of a real register (defaults exist for a lone
# dev instance but MUST be set per node in production):
#   pos.terminal.id           -> unique per register (default POS01:
#                                two registers on the default collide
#                                on the store node - numbers and chains)
#   pos.sync.store-url/token  -> consolidation target
#   pos.valuation.url/user/password -> pricing engine
#
# DEV PROFILE notes: H2 in-memory with drop-and-create wipes the base
# at each restart (DataInitializer reseeds, fiscal continuity is a
# production concern only) and the hardware-api URL points back to the
# register itself, where the simulator endpoints live.
# =====================================================================

# Configuration de la base de donn�es
quarkus.datasource.db-kind=h2
quarkus.datasource.username=username
quarkus.datasource.password=password
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1

# Configuration Hibernate
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# --- Securite ---
# LES ECRANS DE VENTE RESTENT ANONYMES. L'operateur s'identifie par badge + PIN
# et son etat vit dans PosState (singleton serveur), pas dans une identite
# HTTP : c'est LockCheckFilter qui detourne vers /lock, pas la securite HTTP.
#
# Le back-office (/admin/*), le journal et GraphQL ont quitte la caisse avec le
# noeud magasin, et le formulaire de connexion, la cle de session et la
# politique qui les gardaient sont partis avec eux : ils ne gardaient plus que
# des portes murees, et un formulaire de connexion ouvert sur chaque caisse du
# magasin pour une identite que plus rien ne consomme est une surface, pas une
# protection.
#
# UNE porte a rouvert depuis, et une seule : /feeds/import/{CODE}, par ou une
# caisse SANS noeud recoit son referentiel. Elle ecrit le catalogue et les
# prix, donc elle est authentifiee -- HTTP Basic, sans formulaire ni session,
# puisqu'aucun humain ne s'y connecte : c'est une surface machine, poussee par
# sh/caisse.sh. Les identites sont les EMPLOYES, par EmployeeIdentityProvider,
# les memes comptes que le badge et le back-office du noeud, avec le meme
# verrouillage. La politique ne nomme que ce chemin : tout le reste de la
# caisse demeure anonyme, et le doit.
quarkus.http.auth.basic=true

# Taille maximale d'un corps de requete. La valeur par defaut du framework est
# de 10 Mo, et le catalogue reel d'un magasin la depasse : les 109 204 articles
# du 07039 pesent 10,4 Mo, et chaque colonne ajoutee au flux partage rapproche
# un peu plus les autres fichiers de la limite. Un catalogue refuse en HTTP 413
# ne donne aucune erreur metier -- l'import n'est jamais appele -- donc la
# limite est posee ici, explicitement, avec de la marge, plutot que subie.
# L'importeur lit le flux par tranches : la limite compte des octets, elle ne
# les met pas en memoire.
quarkus.http.limits.max-body-size=64M
quarkus.http.auth.permission.feed-import.paths=/feeds/import/*
quarkus.http.auth.permission.feed-import.policy=authenticated
quarkus.http.auth.permission.feed-import.auth-mechanism=basic
# Le statut est en lecture seule et sonde par la supervision et la pile de
# demo : il reste ouvert, comme avant.
quarkus.http.auth.permission.feed-status.paths=/feeds/import/status
quarkus.http.auth.permission.feed-status.policy=permit
quarkus.http.auth.permission.feed-status.methods=GET

# --- Amorcage en production du PREMIER administrateur ------------------
# DataInitializer est @IfBuildProfile(anyOf = {"dev", "test"}) : l'uber-jar
# d'une caisse en exploitation ne contient aucun employe, et la porte CSV
# ci-dessus est @RolesAllowed("ADMIN"). Quand la table est vide ET que ce
# mot de passe est renseigne, le demarrage cree l'employe ADMIN initial
# (changement de mot de passe impose a la premiere connexion). Pas de
# variable = pas de compte = personne ne se connecte : jamais de valeur
# par defaut devinable dans le binaire.
pos.bootstrap.admin.username=admin
pos.bootstrap.admin.email=admin@pos.local
%prod.pos.bootstrap.admin.password=${POS_ADMIN_PASSWORD:}

# Enable Virtual Threads (Project Loom)
quarkus.threading.virtual.enabled=true

# Configuration des logs
quarkus.log.level=INFO
quarkus.log.category."com.intermarche".level=DEBUG
quarkus.log.category."stdout".level=INFO

# Configuration de la console
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=DEBUG

# Optimisation Hibernate
quarkus.hibernate-orm.jdbc.batch_size=1000
quarkus.hibernate-orm.jdbc.order_inserts=true
quarkus.hibernate-orm.jdbc.order_updates=true

# CORS
quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=/.*/

# --- Configuration du client Hardware (Mock) ---
%dev.quarkus.rest-client.hardware-api.url=http://localhost:8080
# Prod default = the qualification doctrine (see deploy/gcp-qualif): point
# the client at the app itself, where the hardware endpoints do not exist,
# so the 404s are absorbed fail-soft (drawer reported closed, silent print).
# Without a default the FIRST gesture touching hardware (unlock -> drawer)
# kills the request with a CDI CreationException. A till with a real
# hardware bridge overrides this per environment.
%prod.quarkus.rest-client.hardware-api.url=http://127.0.0.1:8080

# --- Patterns de reconnaissance des codes scann�s ---
# Badge Employ� : 8 chiffres exactement
scan.pattern.badge=^\\d{8}$
# Carte fidélité : préfixe 299 + 10 chiffres — LE discriminant du programme
# imfid (KEY_CARD_PREFIX=299 dans son référentiel). Ne PAS remettre 789 ici :
# c'est le motif du CHÈQUE FIDÉLITÉ, porté par le type de coupon
# LOYALTY_CHEQUE. Les deux handlers partagent la priorité 1 et ne restent
# départageables que si leurs domaines sont disjoints.
scan.pattern.fidelity=^299\\d{10}$
# Sondage back-office (LC-03-07-03) : code-barre portant la fonction sondage et
# l'identifiant du sondage administr� � un groupe capturant, l'identifiant.
scan.pattern.survey=^SONDAGE-(\\d{1,6})$

# --- Real barcode scanner (prod build only, ui.hardware.scanner) ---
# Autodiscovery by device NAME on the Linux input layer: the reader grabs
# every /dev/input/event* whose advertised name matches one of these
# fragments (case-insensitive). Broad retail default; add a brand for an
# unusual model without rebuilding. Set pos.scanner.enabled=false on a till
# with no scanner. Needs read rights on /dev/input (a udev rule).
pos.scanner.enabled=true
pos.scanner.name-patterns=symbol,zebra,honeywell,datalogic,newland,opticon,scanner,barcode
pos.scanner.sink-url=http://127.0.0.1:8080/api/pos/scan

# --- Phase 7 - remote valuation engine ---
# Absent or blank url = the local catalog engine runs alone (current
# behavior). Present = the remote engine revalues the cart after EVERY
# cart mutation (synchronous: engine on the same machine, dedicated to
# this register) plus a final fix at payment entry, with the local
# engine as the degraded fallback (sale never blocked). A failure opens
# a circuit breaker for pos.valuation.retry-seconds (default 10) so a
# hung engine never charges its timeout to every scan. Credentials feed
# HTTP Basic auth; omit them for an unauthenticated engine.
pos.valuation.url=http://localhost:8090
pos.valuation.user=admin
pos.valuation.password=admin
# pos.valuation.timeout-millis=2500
# pos.valuation.retry-seconds=10

# --- Hub de paiement Nexo Retailer (LC-02-09, LC-05-03-01, LC-07-11) ---
# Absent ou vide = pas de hub : le code d'un article dematerialise est garde
# sur la ligne sans activation, et la carte cadeau suit le registre emetteur.
# Present = activation, annulation et desactivation des articles
# dematerialises, solde et paiement des cartes cadeaux par le hub
# (POST <url>/api/nexo). En dev, le hub simule de la caisse elle-meme.
%dev.pos.nexo.hub-url=http://localhost:8080

# --- Garantie cheque (BO-03-02-24) ---
# Adresse du service de garantie cheque quand le back-office n'en administre
# aucune (parametre cheque.guarantee-url). Le service n'est interroge que si
# le back-office nomme un prestataire (cheque.guarantee-provider). En dev, le
# prestataire simule de la caisse elle-meme (POST <url>/api/cheque-guarantee).
%dev.pos.cheque-guarantee.url=http://localhost:8080
# pos.nexo.poi-id=NEXO-HUB


# --- Programme de fidélit imfid (phase imfid) -------------------------
# Absent ou vide = la caisse fonctionne sans fidlit (aucun appel, aucun
# badge d'avantage). Prsent = earn projet aprs chaque valorisation,
# cagnotte payable sous bail, vnements remonts par l'outbox.
pos.fid.url=http://localhost:8060
pos.fid.user=pos
pos.fid.password=pos-password

# --- EAN techniques des lignes fabriques par la caisse ----------------
# Toute ligne de ticket porte un EAN : le moteur de valorisation prix le
# TICKET ENTIER et doit pouvoir rsoudre chacune des lignes reues. Les
# trois lignes ci-dessous ne viennent d'aucun scan (la caisse les fabrique)
# et reoivent donc un EAN technique. CES CODES DOIVENT AUSSI EXISTER
# CT MOTEUR, sinon il refusera les lignes qui les portent.
# Plage 399xxxxxxxxxx rserve aux lignes internes : aucun article vendu
# ne doit porter un de ces codes.
pos.ean.donation=3990000000001
pos.ean.deconsignment=3990000000002
pos.ean.unknown-item=3990000000003

# --- Pause automatique (LC-01-03-02) -----------------------------------
# Delai d'inactivite (secondes) avant deconnexion automatique de
# l'operateur et retour a CAISSE FERMEE. Les polls d'ecran ne comptent
# jamais comme activite. 0 (defaut) = desactive.
pos.auth.idle-lockout-seconds=0

# --- Affichage de l'EAN (LC-02-04-02 / LC-02-04-04) --------------------
# true = l'EAN accompagne le libelle article sur la visu caisse, la visu
# client et le ticket imprime. false (defaut) = libelle seul.
pos.display.show-ean=false

# --- Terminal de paiement (TPE) ----------------------------------------
# Implementation du port PaymentTerminalClient :
#   virtual  (defaut) = TPE simule (boutons ACCEPTER/REFUSER du simulateur)
#   auto              = pas de TPE : acceptation immediate (ancien pos.tpe.virtual=false)
#   verifone          = monetique integree Verifone FR (SQUELETTE : les trames
#                       exactes attendent la specification du protocole)
#   bridge            = TPE reel, atteint par le pont materiel comme les autres
#                       peripheriques : POST /payment lance, GET /payment suit
pos.tpe.mode=virtual
# Client monetique Verifone local (mode verifone uniquement)
#pos.tpe.verifone.host=127.0.0.1
#pos.tpe.verifone.port=8200
#pos.tpe.verifone.timeout-ms=60000
# Suivi du paiement par le pont materiel (mode bridge uniquement). Le delai
# borne un porteur de carte, pas une machine : cinq minutes.
#pos.tpe.bridge.poll-ms=500
#pos.tpe.bridge.deadline-ms=300000

# --- Lecteur de cheques -------------------------------------------------
# Le cheque est LU avant d'etre enregistre : un cheque refuse par le lecteur ne
# doit pas laisser une ligne reglee sur le ticket. Le delai borne une caissiere
# et un client, pas une machine.
#pos.cheque.poll-ms=500
#pos.cheque.deadline-ms=60000

# --- Livraison des flux au moteur imvaluation local -------------------
# Chaque noeud POS (magasin comme caisse) livre les fichiers de flux
# verbatim (domaine ENGINE_FEEDS) a son imvaluation attache, dans l'ordre
# du catalogue (partages avant specifiques), avec ACK par version.
# La livraison utilise pos.valuation.url/user/password (absents = inactif).
#pos.valuation.feed-delivery-seconds=30
#pos.valuation.feed-timeout-millis=60000

# --- Langues deposees hors du jar -------------------------------------
# La liste des langues de l'interface n'est PAS figee dans le logiciel : elle
# est decouverte des fichiers messages/msg_<langue>.properties livres dans le
# jar, plus ceux deposes dans le repertoire ci-dessous. Un pays qui veut
# l'espagnol y depose msg_es.properties -- a la main ou par le tirage des
# referentiels -- et la caisse le propose au prochain affichage de l'ecran des
# langues, sans recompilation et sans livraison. Chaque fichier porte le nom de
# sa propre langue dans sa cle language.self, de sorte qu'ajouter une langue ne
# touche aucun autre fichier. Vide : seuls les bundles du jar sont offerts.
#pos.messages.dir=/root/Henri/messages
