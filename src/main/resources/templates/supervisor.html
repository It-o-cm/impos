<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appel Superviseur</title>
    <style>
        /* --- CSS STRICT DU DESIGN ORIGINAL --- */
        :root {
            --bg-dark: #121212;
            --bg-panel: #1E1E1E;
            --text-main: #FFFFFF;
            --text-muted: #AAAAAA;
            --primary: #0055FF;
            --success: #00C853;
            --danger: #D32F2F;
            --warning: #FF9800;
            --border-color: #333333;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #000; color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .pos-terminal {
            width: 1000px; height: 600px; background-color: var(--bg-dark);
            border: 2px solid #444; border-radius: 10px;
            display: grid; grid-template-rows: 60px 1fr 80px;
            overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.8); position: relative;
        }

        /* Top Bar & Bottom Nav (Layout) */
        .top-bar { background-color: #000; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 1.2rem; color: var(--text-muted); z-index: 2; }
        .top-bar .store-name { color: var(--danger); font-weight: bold; font-size: 1.4rem; }
        .bottom-nav { background-color: #000; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; padding: 0 10px; }
        .main-area { display: grid; grid-template-columns: 1.5fr 1fr; }

        /* Bouton Générique */
        .btn { padding: 15px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; text-transform: uppercase; box-shadow: 0 4px 0 rgba(0,0,0,0.3); transition: all 0.1s; text-decoration: none; text-align: center; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-muted { background-color: #555; }

        /* --- STYLES SPECIFIQUES SUPERVISEUR (Design Original) --- */
        .overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.97); display: none; flex-direction: column; z-index: 10; border-radius: 10px; padding: 20px; overflow-y: auto; }
        .overlay.active { display: flex; }
        .overlay-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #444; padding-bottom: 10px; flex-shrink: 0; }
        .overlay-title { font-size: 1.5rem; }
        .close-btn { font-size: 2rem; background: none; border: none; color: var(--text-muted); cursor: pointer; }

        .supervisor-content {
            margin: auto; text-align: center; display: flex; flex-direction: column;
            gap: 20px; align-items: center;
        }
        .supervisor-icon { width: 64px; height: 64px; }
    </style>
</head>
<body>

<div class="pos-terminal">
    <div class="top-bar">
        <span class="store-name">INTERMARCHÉ</span>
        <span id="opInfo">CAISSE 04 | Opérateur : MARIE</span>
        <span id="clock">--:--:--</span>
    </div>
    <div class="main-area"></div>
    <div class="bottom-nav"></div>

    <!-- OVERLAY APPEL SUPERVISEUR -->
    <div class="overlay active" id="supervisorScreen">
        <!-- On garde le header pour la consistance, mais le design centré utilise tout l'espace -->
        <div class="overlay-header">
            <div class="overlay-title">APPEL SUPERVISEUR</div>
            <a href="/" class="close-btn">&times;</a>
        </div>

        <div class="supervisor-content">
            <!-- Icône SVG exacte du design original -->
            <svg class="supervisor-icon" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>

            <div class="overlay-title" style="color:var(--warning); margin-bottom:20px;">APPEL SUPERVISEUR</div>

            <div style="color:var(--text-muted); font-size:1.2rem;">
                Un superviseur a été prévenu.<br>Veuillez patienter.
            </div>

            <a href="/" class="btn btn-muted" style="width:250px; height:70px; margin-top:20px;">
                ANNULER L'APPEL
            </a>
        </div>
    </div>
</div>

<script>
    setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('fr-FR'); }, 1000);
</script>

</body>
</html>
