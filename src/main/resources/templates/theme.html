{!
 ! THE design-token single source of truth of the register, included at the
 ! TOP of every screen's <style> as {#include theme /}. Extracted from the
 ! 21 byte-identical :root blocks the screens used to duplicate — add or
 ! change a token HERE and every screen follows; never redeclare :root in a
 ! template again. Also owns the overlay-banner system (absolute strips over
 ! the positional grids: training z-50, degraded z-49, advantages z-48,
 ! suggestion z-47 — see the grid trap note in main.html). The public
 ! digital-ticket page deliberately does NOT include this theme: it is the
 ! customer's receipt on the customer's own device, a different audience
 ! with its own lighter identity.
 !}
        :root {
            --bg-dark: #121212; --bg-panel: #1E1E1E; --text-main: #FFFFFF;
            --text-muted: #AAAAAA; --primary: #0055FF; --success: #00C853;
            --danger: #D32F2F; --warning: #FF9800; --border-color: #333333;
            --accent: #FFC400;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }

        /* Overlay banners: full-width strips laid OVER the positional grids
           (never grid children). Stacking order is semantic: training wins
           over degraded, degraded over advantages, advantages over
           suggestions. */
        .overlay-banner { position: absolute; left: 0; right: 0; text-align: center; font-weight: bold; padding: 3px; letter-spacing: 1px; }
        .overlay-training { top: 0; z-index: 50; background: var(--warning); color: #000; letter-spacing: 2px; font-size: 0.95rem; }
        .overlay-degraded { top: 0; z-index: 49; background: var(--danger); color: #FFF; }
        .overlay-advantage { top: 0; z-index: 48; background: var(--success); color: #000; }
        .overlay-suggestion { bottom: 0; z-index: 47; background: var(--accent); color: #000; }

        /* Keyboards: the ONE rendering of every pad and keyboard of the
           register (keyboard-lib renders this markup; its own JS-injected
           copy of these rules is a standalone fallback kept in sync — see
           keyboard-lib.html). Never override .pos-key metrics locally: the
           whole point is that a key looks the same on every screen. */
        .pos-keyboard { display: grid; gap: 6px; width: 100%; }
        .pos-keyboard--cols3 { grid-template-columns: repeat(3, 1fr); }
        .pos-keyboard--cols4 { grid-template-columns: repeat(4, 1fr); }
        .pos-keyboard--alpha { grid-template-columns: repeat(10, 1fr); }
        .pos-key {
            padding: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            text-align: center;
            color: var(--text-main);
            background: var(--bg-panel);
        }
        .pos-key:active { filter: brightness(1.3); }
        .pos-key--digit { background: var(--bg-panel); color: var(--text-main); }
        .pos-key--danger { background: var(--danger); color: var(--text-main); }
        .pos-key--success { background: var(--success); color: var(--text-main); }
        .pos-key--action { background: #000; color: var(--warning); }
        .pos-key--alpha { font-size: 1.5rem; text-transform: uppercase; }
        .pos-key--wide { grid-column: span 2; }
