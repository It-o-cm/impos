<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erreur Tiroir</title>
  <style>
    {#include theme /}
    body { background-color: var(--bg-page); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; }

    .pos-terminal {
      width: 1000px; height: 600px; background-color: var(--bg-dark);
      border: 2px solid var(--border-strong); border-radius: 10px;
      display: grid; grid-template-rows: 60px 1fr 80px;
      overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.8); position: relative;
    }

    /* Header & Footer Layout */
    .top-bar { background-color: var(--bg-page); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 1.2rem; color: var(--text-muted); z-index: 2; }
    .top-bar .store-name { color: var(--danger); font-weight: bold; font-size: 1.4rem; }
    .bottom-nav { background-color: var(--bg-page); border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; padding: 0 10px; }
    .main-area { display: grid; grid-template-columns: 1.5fr 1fr; background-color: var(--bg-dark); }

    /* Error Screen Overlay */
    .error-screen {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(26, 5, 5, 0.98);
      border: 8px solid var(--danger);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 50; border-radius: 10px; gap: 25px;
      box-shadow: inset 0 0 50px rgba(211, 47, 47, 0.2);
    }

    .error-icon { font-size: 5rem; animation: pulse 1.5s infinite; text-shadow: 0 0 20px var(--danger); }
    .error-title { font-size: 3.2rem; color: var(--danger); font-weight: bold; text-align: center; line-height: 1.1; text-transform: uppercase; letter-spacing: 2px; }
    .error-sub { color: #ddd; font-size: 1.3rem; text-align: center; max-width: 600px; }

    /* Bouton Reprendre */
    .btn {
      padding: 18px 50px; font-size: 1.4rem; border-radius: 8px;
      font-weight: bold; border: none; cursor: pointer; text-transform: uppercase;
      text-decoration: none; display: inline-block;
    }
    .btn-warning:active { transform: translateY(4px); box-shadow: none; }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body data-theme="{posTheme}">

<div class="pos-terminal">
  <div class="top-bar">
    <span class="store-name">INTERMARCHÉ</span>
    <span id="opInfo">CAISSE 04 | Opérateur : {state.operatorName}</span>
    <span id="clock">--:--:--</span>
  </div>

  <div class="main-area"></div>
  <div class="bottom-nav"></div>

  <div class="error-screen">
    <div class="error-icon">⚠️</div>
    <div class="error-title">TIROIR CAISSE<br>OUVERT</div>
    <div class="error-sub">
      Aucune action n'est autorisée tant que le tiroir est ouvert.<br>
      Veuillez le fermer pour poursuivre.
    </div>

    <!-- On garde le bouton manuel en solution de secours -->
    <a href="/action/resume-after-drawer" class="btn btn-warning">REPRENDRE</a>
  </div>
</div>

<script>
  // Horloge
  setInterval(() => {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('fr-FR');
  }, 1000);

  // Polling automatique pour vérifier l'état du tiroir
  setInterval(() => {
    fetch('/api/drawer-status')
            .then(response => response.json())
            .then(data => {
              // Si le tiroir est fermé ("open" == false), on redirige
              if (!data.open) {
                window.location.href = data.redirect;
              }
            })
            .catch(err => console.error("Erreur vérification tiroir", err));
  }, 1000); // Vérifie toutes les secondes
</script>

</body>
</html>
