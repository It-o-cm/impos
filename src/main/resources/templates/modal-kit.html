{!
 ! THE REGISTER'S MODAL LOOK, shared by the drawer screens (TIROIR menu) shown in a
 ! modal over the sale. Included inside each page's <style>, after the theme.
 !
 ! - FRAME: a title row, the body, an actions row — on the panel colour, with no
 !   band above or below. The title is centred, in the primary colour.
 ! - OUTCOME: one banner at the top of the body, green when the gesture was done,
 !   red when it was refused, amber for a warning.
 ! - CHOICES: a short list of options is a row of toggles (a radio and its label),
 !   one tap and the choice shows, instead of a drop-down to unfold.
 ! - ACTIONS: the gesture's buttons on the left, RETOUR always bottom right.
 ! - TYPE SCALE: the register's root size follows its viewport; inside the frame
 !   the viewport is the frame's, smaller, and the screen would draw everything
 !   smaller than the sale around it. Shown in the frame, the page takes the
 !   register page's root size, the unit its data-modal-size is written in.
 ! - COUNT: a denomination count (withdrawal, apport) — the tabbed list of
 !   denominations on the left, the running total and the pad on the right.
!}
<style>
body { background: var(--bg-panel); color: var(--text-main); margin: 0; }
.pos-terminal { grid-template-rows: 3.25rem minmax(0, 1fr) 4.5rem; background: var(--bg-panel); }
.mk-title { display: flex; align-items: center; justify-content: center; padding: 0 20px; }
.mk-title .title { color: var(--primary); font-weight: bold; font-size: var(--fs-title); text-transform: uppercase; letter-spacing: 0.5px; text-align: center; }
.mk-body { min-height: 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 4px 20px 0; }
.mk-outcome { flex-shrink: 0; border-radius: 8px; padding: 8px 14px; font-weight: bold; font-size: var(--fs-body); border: 2px solid var(--success); color: var(--success); }
.mk-outcome.err { border-color: var(--danger); color: var(--danger); }
.mk-outcome.warn { border-color: var(--warning); color: var(--warning); }
.mk-columns { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 18px; }
.mk-column { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
.mk-label { font-size: var(--fs-label); color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
.mk-field { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.mk-choices { display: flex; flex-wrap: wrap; gap: 6px; }
.mk-choices input { position: absolute; opacity: 0; pointer-events: none; }
.mk-choice { display: inline-flex; flex-direction: column; justify-content: center; min-height: 2.75rem; padding: 6px 14px; border-radius: 8px; border: 2px solid var(--border-color); background: var(--bg-row); color: var(--text-main); font-weight: bold; font-size: var(--fs-row); text-transform: uppercase; cursor: pointer; }
.mk-choice .sub { color: var(--text-muted); font-size: var(--fs-row-sub); font-weight: normal; text-transform: none; }
.mk-choices input:checked + .mk-choice { border-color: var(--primary); color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.mk-display { font-size: var(--fs-field); color: var(--primary); font-weight: bold; background: var(--bg-page); border: 2px solid var(--border-color); border-radius: 6px; padding: 8px 12px; text-align: right; cursor: pointer; }
.mk-display.mk-active { border-color: var(--primary); }
.mk-select { width: 100%; padding: 8px 10px; font-size: var(--fs-field); font-weight: bold; background: var(--bg-page); color: var(--text-main); border: 2px solid var(--border-color); border-radius: 6px; }
.mk-hint { color: var(--text-muted); font-size: var(--fs-body); }
.mk-notice { flex-shrink: 0; border: 1px solid var(--warning); border-radius: 6px; padding: 6px 10px; color: var(--warning); font-weight: bold; font-size: var(--fs-body); }
.mk-empty { color: var(--text-muted); text-align: center; padding: 30px; font-weight: bold; }
.mk-keyboard { min-height: 0; }
.mk-actions { display: flex; align-items: center; gap: 12px; padding: 0 20px; }
.mk-actions .btn { min-width: 12rem; }
.mk-actions .mk-back { margin-left: auto; }
.count-area { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: 10px 18px; }
.count-side { min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.count-list-area { flex: 1 1 auto; display: flex; flex-direction: column; overflow: hidden; min-height: 0; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-inset); }
.tabs-container { display: flex; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
.tab-btn { flex: 1; padding: 10px; background: none; border: none; color: var(--text-muted); font-size: var(--fs-btn-sm); font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; text-transform: uppercase; }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
.items-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 5px; }
.count-item { display: grid; grid-template-columns: minmax(0, 1fr) 6rem 8rem; align-items: center; background: var(--bg-row); padding: 8px 14px; border-radius: 6px; border: 2px solid var(--border-color); cursor: pointer; }
.count-item.selected { border-color: var(--primary); }
.item-label { font-size: var(--fs-row); font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-qty { text-align: center; font-size: var(--fs-row); color: var(--text-muted); }
.item-total { text-align: right; font-size: var(--fs-row); font-weight: bold; color: var(--primary); }
.total-box { background: var(--bg-page); border: 2px solid var(--primary); border-radius: 8px; padding: 8px; text-align: center; flex-shrink: 0; }
.total-amount { font-size: var(--fs-total); font-weight: bold; color: var(--primary); }
.numpad-container { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
</style>
<script>
  (function () {
    if (window.top === window.self) { return; }
    try {
      document.documentElement.style.fontSize = window.top.getComputedStyle(window.top.document.documentElement).fontSize;
    } catch (e) {
      /* Another origin's frame keeps its own scale. */
    }
  })();
</script>
