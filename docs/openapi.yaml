      x-build-profile: declared by two resources in the same build profile(s); JAX-RS matching selects one
      description: |-
        Relays the terminal status poll to the register — mirror of `PosHardwareResource.tpeStatus()`. Without this relay the JAX-RS shadowing (see the note above) sends the simulator's 1-second `GET /api/hardware/tpe` poll to a 404: the pending amount never shows and the ACCEPT/REFUSE buttons stay disabled.

        Java: `MockHardwareResource#tpeStatus` — returns `java.util.Map<String, Object>`. Exists only in build profile(s) `dev`, `test`.

        **Alternative implementation** — Returns the state of the virtual payment terminal, polled by the simulator: whether a card request is pending and its amount.

