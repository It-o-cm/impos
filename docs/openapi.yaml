        **Alternative implementation** — Shows a text on the customer line display.

        STUB for the Diebold Nixdorf BA9x USB display: accepts and drops the text. The real driver writes it to the two-line VFD.

        Java: `RealHardwareResource#setDisplay` — returns `void`. Exists only in build profile(s) `prod`. Responses there: 204.
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: OK
        '503':
          description: Service Unavailable
        '204':
          description: No Content
