      summary: SHOWS the X report of the open session (read-only snapshot).
      operationId: CashSessionResource_showXReport
      description: |-
        SHOWS the X report of the open session (read-only snapshot).

        An X is a READING: its whole purpose is to look at where the session stands — mid-shift check, handover between cashiers, control before a withdrawal. It used to exist as a print alone, so an operator pressing the key saw nothing at all, and nothing whatsoever on a register whose printer is out of paper. The paper is now what one asks for AFTER reading, not instead of it.

        Nothing is journalled here: a reading on screen is not an edition. The journal entry belongs to the print, which is the copy that leaves the register.

        Java: `CashSessionResource#showXReport` — returns `Object`.
      responses:
        '200':
          description: OK — the report page, or a redirect to the session page when none is open
          content:
            text/html:
              schema: {}
