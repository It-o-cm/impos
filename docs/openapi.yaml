  /action/search/scan:
    post:
      tags:
      - ProductSearchResource
      summary: Hands a code the operator TYPED to the scan chain (`LC-06-01-01`).
      operationId: ProductSearchResource_scanTypedCode
      description: |-
        Hands a code the operator TYPED to the scan chain (`LC-06-01-01`).

        The search above only ever offers CATALOG articles, which is the right answer for a product and the wrong one for everything else: a counter-ticket reference, a voucher, a loyalty card are all codes that exist and that the catalog has never heard of, so they can never appear in a result list. When a scanner cannot read a damaged barcode, the operator reads it out — and what they type must reach exactly what the scanner would have reached.

        So this route does NOT look anything up: it walks the code through `processScan`, the same chain, in the same order, under the same guards. Typing is scanning.

        Java: `ProductSearchResource#scanTypedCode` — returns `Response`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                q:
                  type: string
                  description: the code typed by the operator
      responses:
        '303':
          description: 'See Other (redirect). Location: `/` — a redirect to the home page'
          headers:
            Location:
              $ref: '#/components/headers/Location'
