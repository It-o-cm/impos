openapi: 3.0.3
info:
  title: impos — HTTP entry points
  version: 1.0-SNAPSHOT
  description: |
    Every JAX-RS entry point exposed by impos (sources `src/main/java` and `src/mock/java`),
    extracted statically from the resource annotations.

    **Nature of the endpoints.** impos is a server-rendered register UI (Quarkus + Qute), not a REST API:

    - `GET` pages return HTML rendered by Qute templates (`text/html`);
    - `/action/**` routes are HTML form posts (`application/x-www-form-urlencoded`) that answer
      `303 See Other` (Post/Redirect/Get) towards the next screen;
    - `/api/**` routes are the JSON / text endpoints (hardware simulator in `src/mock`, scanner input,
      valuation engine mock, feed status...).

    **Cross-cutting request filters** (not repeated on each operation):

    - `SessionCheckFilter` — when no cash session is open (and the register is neither locked nor in
      training mode), any path outside its allow-list answers `303` → `/session?error=no-session`.
      Allow-listed prefixes: `/session`, `/action/session`, `/cash-count`, `/lock`, `/action/unlock`,
      `/action/hardware-override`, `/action/resume-after-drawer`, `/action/training`, `/weight`,
      `/pin-change`, `/action/pin-change`, `/badge-print`, `/action/badge-print`, `/theme-select`,
      `/action/theme`, `/supervisor`, `/action/supervisor`, `/drawer-error`, `/api/`, `/t/`, `/customer`,
      `/ticket-fragment`, `/endorsement-data`.
    - `LockCheckFilter` — while the register is locked, any path outside its allow-list answers
      `303` → `/lock`. Allow-listed prefixes: `/lock`, `/action/unlock`, `/api/`, `/t/`, `/customer`,
      `/ticket-fragment`, `/endorsement-data`.
    - `DrawerCheckFilter` — on resources annotated `@DrawerMustBeClosed`, while the cash drawer is open,
      answers `303` → `/drawer-error` unless the method is annotated `@DrawerMayBeOpen`.

    **Not covered here:** Quarkus built-in routes (`/q/health`, `/q/openapi`, `/q/swagger-ui`, dev UI),
    static resources (`META-INF/resources`), and the outgoing REST client `HardwareClient`
    (it *calls* `/api/hardware/**`, it does not expose anything).

    Status codes on `Response`-returning methods are inferred from the method bodies
    (`Response.seeOther`, `Response.status(...)`, thrown `WebApplicationException`s); response
    bodies of `Map<String, Object>` JSON endpoints list the keys found in the code.
servers:
- url: http://localhost:8080
  description: Local register (dev / prod on the till)
tags:
- name: AuthResource
  description: |-
    JAX-RS resource driving the lock screen: lock page, badge polling and unlock action.

    `com.intermarche.pos.ui.auth.AuthResource` (src/main)
- name: BadgePrintResource
  description: |-
    Operator badge reprint (LC-01-06-01): the typed operator number is parked as the endorsed action `PRINT_BADGE_` — the print itself runs in the endorsement dispatch, strictly AFTER a manager approval (or the connected-supervisor shortcut), like every guarded gesture.

    `com.intermarche.pos.ui.auth.BadgePrintResource` (src/main)
- name: CashCountResource
  description: |-
    JAX-RS resource of the drawer-count page, the middle step of the Z closing: `/action/session/close-start` routes here after its checks, `/action/start-cash-count` opens the drawer, the page's client-side calculator sums the typed denomination counts, and the validated total (with its per-denomination JSON) is posted to `/action/session/close`. Every display route is `@DrawerMayBeOpen` — counting happens with the drawer open by definition, while the rest of the register stays behind the drawer guard.

    `com.intermarche.pos.ui.cash.CashCountResource` (src/main)
- name: CashMovementResource
  description: |-
    JAX-RS resource of the cash-movement screen: the cashier records a drawer movement (withdrawal, deposit, expense, customer down-payment or cash-count declaration) with its amount and reason, and the movement is written to the register's own database and pushed to the store node through the outbox by `CashMovementService` — no synchronous network call sits in this path, so a register cut off from the network keeps recording movements.

    `com.intermarche.pos.ui.cash.CashMovementResource` (src/main)
- name: CashSessionResource
  description: |-
    JAX-RS resource driving the cash-session screen: session status page, opening with an initial float, X report printing, and the Z closing flow that runs through the cash-count page.

    `com.intermarche.pos.ui.cash.CashSessionResource` (src/main)
- name: CustomerDisplayResource
  description: |-
    Customer-facing display (phase 4): a dedicated page opened on the second screen, polling its own fragment with the same version mechanism as the main screen. Shows the running cart, the totals, the payment progress and, once complete, the change and the digital receipt link. No lock applies — it is a display, not a control surface.

    `com.intermarche.pos.ui.customer.CustomerDisplayResource` (src/main)
- name: DigitalTicketResource
  description: |-
    Public digital receipt (phase 4): the customer opens the short link printed on the paper ticket (and shown on the customer display) from their own device — no register lock applies. Access requires the unguessable key generated at draft creation; only closed tickets are shown.

    `com.intermarche.pos.ui.customer.DigitalTicketResource` (src/main)
- name: DrawerOperationsResource
  description: |-
    The two gestures that move money inside the drawer without a customer in front of the register: the manual withdrawal of a tender (`LC-12-03`) and the transfer of a settlement from one tender to another (`LC-12-10`).

    `com.intermarche.pos.ui.cash.DrawerOperationsResource` (src/main)
- name: EndorsementResource
  description: |-
    JAX-RS resource driving the manager-endorsement modal: polling endpoint, validation of the endorsed action and cancellation.

    `com.intermarche.pos.ui.endorsement.EndorsementResource` (src/main)
- name: EngineFeedStatusResource
  description: |-
    Reports how far the LOCAL valuation engine is behind the feeds this register holds: per feed, the stored version, the version the engine last acknowledged, whether the two match, and the last delivery error.

    `com.intermarche.pos.ui.valuation.EngineFeedStatusResource` (src/main)
- name: FidelityResource
  description: |-
    JAX-RS resource of the manual fidelity-card entry page — the fallback when the card does not scan (the scan handler is the primary path). Class is `@DrawerMustBeClosed` like the other sale screens: attaching a card is a sale gesture, not a drawer one.

    `com.intermarche.pos.ui.fidelity.FidelityResource` (src/main)
- name: FruitResource
  description: |-
    JAX-RS resource of the FRUITS & LÉGUMES weighing screen. Display only: the tap on a fruit goes through the ticket actions, this resource just shows the grid.

    `com.intermarche.pos.ui.ticket.FruitResource` (src/main)
- name: HomeResource
  description: |-
    JAX-RS resource driving the home screen: drawer-error handling, main pages, navigation, line selection/cancellation, price-modification modal and item addition actions.

    `com.intermarche.pos.ui.home.HomeResource` (src/main)
- name: InvoiceResource
  description: |-
    JAX-RS resource of the invoice screen, under its own `/invoice` prefix.

    `com.intermarche.pos.ui.invoice.InvoiceResource` (src/main)
- name: ManualResource
  description: |-
    JAX-RS resource of the SAISIE DIRECTE drill-down: root level and category levels. Adding the chosen product goes through the ticket actions.

    `com.intermarche.pos.ui.ticket.ManualResource` (src/main)
- name: MockHardwareResource
  description: |-
    The EMBEDDED HARDWARE SIMULATOR: the scale, the drawer, the customer display, the printer and the virtual payment terminal, driven over HTTP so that a register with no peripheral attached can still be sold, tested and demonstrated.

    `com.intermarche.pos.ui.resource.MockHardwareResource` (src/main)

    Exists only in build profile(s) `dev`, `test`.
- name: MockValuationResource
  description: |-
    Embedded VALUATION-ENGINE SIMULATOR for the autonomous e2e runs — the pricing sibling of `MockHardwareResource`: the register under test must never depend on an externally running imvaluation, so `E2eTestProfile` points `pos.valuation.url` at the test application itself (`http://localhost:8081/api`) and this endpoint answers the client's `POST {url`/valuation}.

    `com.intermarche.pos.ui.resource.MockValuationResource` (src/main)
- name: ParkedTicketResource
  description: |-
    JAX-RS resource driving parked tickets: parking the current cart, listing the parked tickets of this register and resuming one.

    `com.intermarche.pos.ui.ticket.ParkedTicketResource` (src/main)
- name: PaymentResource
  description: |-
    JAX-RS resource driving the payment screen: payment method actions, voucher entry flow, payment history pagination, finalization and printing.

    `com.intermarche.pos.ui.payment.PaymentResource` (src/main)
- name: PinChangeResource
  description: |-
    JAX-RS resource of the PIN change page for the logged-in operator: same page on success (confirmation) and on failure (typed error, retry). The current-PIN verification is direct — it does not increment the shared lockout counter (see `AuthService`).

    `com.intermarche.pos.ui.auth.PinChangeResource` (src/main)
- name: PosHardwareResource
  description: |-
    Inbound endpoints of the simulated hardware: scanner, scale and, since phase 6, the virtual payment terminal — the simulator polls the pending card request and answers with an accept or refuse decision.

    `com.intermarche.pos.ui.home.PosHardwareResource` (src/main)
- name: ProductSearchResource
  description: |-
    JAX-RS resource driving the product search screen: full-text search over the active catalog and one-tap addition of a result to the ticket.

    `com.intermarche.pos.ui.ticket.ProductSearchResource` (src/main)
- name: RealHardwareResource
  description: |-
    The REAL hardware boundary of a production till — the future home of the physical device drivers, serving the exact `HardwareClient` contract on `/api/hardware/**`.

    `com.intermarche.pos.ui.hardware.RealHardwareResource` (src/main)

    Exists only in build profile(s) `prod`.
- name: RefundResource
  description: |-
    JAX-RS resource driving the refund screens: ticket search, line quantity edition and refund-method choice.

    `com.intermarche.pos.ui.returnprocess.RefundResource` (src/main)
- name: ReprintResource
  description: |-
    JAX-RS resource of the reprint screen, under its own `/reprint` prefix: history list, paged navigation, ticket detail and the duplicata print action. Review is free (reading persisted tickets mutates nothing); only the print action carries fiscal weight — it bumps the duplicata counter and is blocked in training by the service.

    `com.intermarche.pos.ui.reprintticket.ReprintResource` (src/main)
- name: ThemeResource
  description: |-
    JAX-RS resource of the theme-selection screen: lists the available themes plus the "store default" choice, and persists the logged cashier's preference (`Employee.theme`).

    `com.intermarche.pos.ui.ThemeResource` (src/main)
- name: TicketAbandonResource
  description: |-
    The abandon screen (`LC-04-04-06` to `-12`): the last thing an operator sees before a sale stops existing.

    `com.intermarche.pos.ui.ticket.TicketAbandonResource` (src/main)
- name: TicketEmailResource
  description: |-
    Sends the last closed ticket by e-mail FROM THE REGISTER (LC-08-02-09/-10/-11).

    `com.intermarche.pos.ui.customer.TicketEmailResource` (src/main)
- name: VoucherBalanceResource
  description: |-
    Stored-value balance consultation (LC-02-09-04): gift cards and credit notes are REGISTRY-backed (`stored_values`), so the balance answer is local and authoritative — no external hub involved. Strictly read-only: consulting never touches the ticket nor the instrument.

    `com.intermarche.pos.ui.payment.VoucherBalanceResource` (src/main)
paths:
  /:
    get:
      tags:
      - HomeResource
      summary: Shows the home page.
      operationId: HomeResource_home
      description: |-
        Shows the home page.

        Java: `HomeResource#home` — returns `TemplateInstance`. `@DrawerMustBeClosed` (redirects to `/drawer-error` while the cash drawer is open).
      responses:
        '200':
          description: HTML page rendered by a Qute template. the home page
          content:
            text/html:
              schema:
                type: string
  /abandon:
    get:
      tags:
      - TicketAbandonResource
      summary: Shows the abandon screen.
      operationId: TicketAbandonResource_showAbandonScreen
      description: |-
        Shows the abandon screen.

        Java: `TicketAbandonResource#showAbandonScreen` — returns `TemplateInstance`. `@DrawerMustBeClosed` (redirects to `/drawer-error` while the cash drawer is open).
      responses:
        '200':
          description: HTML page rendered by a Qute template. the abandon page
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - TicketAbandonResource
      summary: 'Confirms the abandon: records the reason and the printing choice, then hands the gesture to the manager endorsement.'
      operationId: TicketAbandonResource_confirmAbandon
      description: |-
        Confirms the abandon: records the reason and the printing choice, then hands the gesture to the manager endorsement.

        Java: `TicketAbandonResource#confirmAbandon` — returns `Object`. `@DrawerMustBeClosed` (redirects to `/drawer-error` while the cash drawer is open).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: the reason the operator picked, blank when the shop asks for none
                print:
                  type: string
                  description: '`on` when the operator asked for the abandon ticket'
      responses:
        '200':
          description: OK — a redirect to the sale screen, or the abandon page carrying the refusal
          content:
            text/html:
              schema: {}
        '303':
          description: See Other (redirect)
  /action/add/{code}:
    get:
      tags:
      - HomeResource
      summary: Adds a weighed product by its PLU code.
      operationId: HomeResource_addPlu
      description: |-
        Adds a weighed product by its PLU code.

        Java: `HomeResource#addPlu` — returns `TemplateInstance`. `@DrawerMustBeClosed` (redirects to `/drawer-error` while the cash drawer is open).
      parameters:
      - name: code
        in: path
        required: true
        description: the PLU code
        schema:
          type: string
      responses:
        '200':
          description: HTML page rendered by a Qute template. the home page
          content:
            text/html:
              schema:
                type: string
  /action/age-check/confirm:
    get:
      tags:
      - HomeResource
      summary: 'Confirms the pending age check (ID verified): the parked add replays and the sale resumes (phase: age control).'
      operationId: HomeResource_ageCheckConfirm
      description: |-
        Confirms the pending age check (ID verified): the parked add replays and the sale resumes (phase: age control).

        Java: `HomeResource#ageCheckConfirm` — returns `Response`. `@DrawerMustBeClosed` (redirects to `/drawer-error` while the cash drawer is open).
      responses:
        '303':
          description: 'See Other (redirect). Location: `/` — a redirect to the sale screen'
          headers:
            Location:
              $ref: '#/components/headers/Location'
  /action/age-check/refuse:
    get:
      tags:
      - HomeResource
      summary: 'Refuses the sale of the age-restricted product: nothing is added and the refusal is journalized (phase: age
        control).'
      operationId: HomeResource_ageCheckRefuse
      description: |-
        Refuses the sale of the age-restricted product: nothing is added and the refusal is journalized (phase: age control).

        Java: `HomeResource#ageCheckRefuse` — returns `Response`. `@DrawerMustBeClosed` (redirects to `/drawer-error` while the cash drawer is open).
      responses:
        '303':
          description: 'See Other (redirect). Location: `/` — a redirect to the sale screen'
          headers:
            Location:
              $ref: '#/components/headers/Location'
  /action/backup-cancel:
    post:
      tags:
      - PaymentResource
      summary: Closes the backup-monetics panel, abandoning the pending request.
      operationId: PaymentResource_closeBackupPanel
      description: |-
        Closes the backup-monetics panel, abandoning the pending request.

        Java: `PaymentResource#closeBackupPanel` — returns `Response`. `@DrawerMustBeClosed` (redirects to `/drawer-error` while the cash drawer is open).
      responses:
        '303':
          description: 'See Other (redirect). Location: `/pay` — a redirect back to the payment page'
          headers:
            Location:
              $ref: '#/components/headers/Location'
  /action/backup-manual:
    post:
      tags:
      - PaymentResource
      summary: Switches the panel to keying the outcome in, for a till whose scanner cannot read 2D codes (LC-07-07-09).
      operationId: PaymentResource_openBackupManualEntry
      description: |-
        Switches the panel to keying the outcome in, for a till whose scanner cannot read 2D codes (LC-07-07-09).

        Java: `PaymentResource#openBackupManualEntry` — returns `Response`. `@DrawerMustBeClosed` (redirects to `/drawer-error` while the cash drawer is open).
      responses:
        '303':
          description: 'See Other (redirect). Location: `/pay` — a redirect back to the payment page'
          headers:
            Location:
              $ref: '#/components/headers/Location'
  /action/backup-open:
    post:
      tags:
      - PaymentResource
      summary: Opens the backup-monetics panel and emits the request QR code (LC-07-07-06/07).
      operationId: PaymentResource_openBackupPanel
      description: |-
        Opens the backup-monetics panel and emits the request QR code (LC-07-07-06/07).

        Java: `PaymentResource#openBackupPanel` — returns `Response`. `@DrawerMustBeClosed` (redirects to `/drawer-error` while the cash drawer is open).
      responses:
        '303':
          description: 'See Other (redirect). Location: `/pay` — a redirect back to the payment page'
          headers:
            Location:
              $ref: '#/components/headers/Location'
  /action/backup-scan:
    post:
      tags:
      - PaymentResource
      summary: Validates the answer scanned off the mobile terminal (LC-07-07-08).
      operationId: PaymentResource_validateBackupScan
      description: |-
        Validates the answer scanned off the mobile terminal (LC-07-07-08).

        Java: `PaymentResource#validateBackupScan` — returns `Response`. `@DrawerMustBeClosed` (redirects to `/drawer-error` while the cash drawer is open).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                payload:
                  type: string
                  description: the scanned text
      responses:
        '303':
          description: 'See Other (redirect). Location: `/pay` — a redirect back to the payment page'
          headers:
            Location:
              $ref: '#/components/headers/Location'
  /action/badge-print:
    post:
      tags:
      - BadgePrintResource
      summary: Parks the badge print as an endorsed action and returns to the sale screen, where the endorsement modal takes
        over.
      operationId: BadgePrintResource_requestBadgePrint
      description: |-
        Parks the badge print as an endorsed action and returns to the sale screen, where the endorsement modal takes over.

        Java: `BadgePrintResource#requestBadgePrint` — returns `Response`. `@DrawerMustBeClosed` (redirects to `/drawer-error` while the cash drawer is open).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                operator:
                  type: string
                  description: the typed operator badge id or login name
      responses:
        '303':
          description: 'See Other (redirect). Location: `/` — a redirect to the sale screen'
          headers:
            Location:
              $ref: '#/components/headers/Location'
  /action/cancel:
    get:
      tags:
      - PaymentResource
      summary: Cancels the registered payments (in memory and on the draft) and redirects to the main page.
      operationId: PaymentResource_cancelPayment
      description: |-
        Cancels the registered payments (in memory and on the draft) and redirects to the main page.

        Java: `PaymentResource#cancelPayment` — returns `Response`. `@DrawerMustBeClosed` (redirects to `/drawer-error` while the cash drawer is open).
      responses:
        '303':
          description: 'See Other (redirect). Location: `/` — a 303 redirect to the main page (same replay-safety rule as
            `#validatePayment()`: a mutating GET never renders the page it lands on)'
          headers:
            Location:
              $ref: '#/components/headers/Location'
  /action/cancelLine:
    get:
      tags:
      - HomeResource
      summary: Cancels the targeted line (directly or via endorsement).
      operationId: HomeResource_cancelLine
      description: |-
        Cancels the targeted line (directly or via endorsement).

        Java: `HomeResource#cancelLine` — returns `TemplateInstance`. `@DrawerMustBeClosed` (redirects to `/drawer-error` while the cash drawer is open).
      responses:
        '200':
          description: HTML page rendered by a Qute template. the home page
          content:
            text/html:
              schema:
                type: string
  /action/cancelTicket:
    get:
      tags:
      - HomeResource
      summary: Sends the operator to the abandon screen, where the shop's rules are applied before the ticket is given up
        (`LC-04-04...
      operationId: HomeResource_cancelTicket
      description: |-
        Sends the operator to the abandon screen, where the shop's rules are applied before the ticket is given up (`LC-04-04-06` to `-12`).

        It no longer requests the endorsement itself: the reason, the fate of a settlement already taken and the printing are decided there, and a second road to the same gesture would be a road around them.

        Java: `HomeResource#cancelTicket` — returns `Response`. `@DrawerMustBeClosed` (redirects to `/drawer-error` while the cash drawer is open).
      responses:
        '303':
          description: 'See Other (redirect). Location: `/abandon` — a redirect to the abandon screen'
          headers:
            Location:
              $ref: '#/components/headers/Location'
  /action/card-cancel:
    get:
      tags:
      - PaymentResource
      summary: Cancels the pending virtual-terminal card request from the register.
      operationId: PaymentResource_cancelPendingCard
      description: |-
        Cancels the pending virtual-terminal card request from the register.

        Java: `PaymentResource#cancelPendingCard` — returns `Response`. `@DrawerMustBeClosed` (redirects to `/drawer-error` while the cash drawer is open).
      responses:
        '303':
          description: 'See Other (redirect). Location: `/pay` — a redirect back to the payment page'
          headers:
            Location:
              $ref: '#/components/headers/Location'
  /action/cash-movement/record:
    post:
      tags:
      - CashMovementResource
      summary: Records a cash movement of the open session.
      operationId: CashMovementResource_record
      description: |-
        Records a cash movement of the open session. Above the administered threshold, a manager endorsement is required and resolved to a badge before the movement is written; below it, no credential is asked.

        Java: `CashMovementResource#record` — returns `Response`.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: the movement type name
                amount:
                  type: string
                  description: the amount typed by the cashier (French comma tolerated)
                reason:
                  type: string
                  description: the movement reason, or null
                paymentMethod:
                  type: string
                managerLogin:
                  type: string
                  description: the endorsing manager's badge or login, or null
                managerPin:
                  type: string
                  description: the endorsing manager's PIN, or null
      responses:
        '200':
          description: OK — a redirect back to the cash-movement page carrying the outcome
  /action/cheque-cancel:
    get:
      tags:
      - PaymentResource
      summary: Cancels the pending cheque reading from the register.
      operationId: PaymentResource_cancelPendingCheque
      description: |-
        Cancels the pending cheque reading from the register.

        Java: `PaymentResource#cancelPendingCheque` — returns `Response`. `@DrawerMustBeClosed` (redirects to `/drawer-error` while the cash drawer is open).
      responses:
        '303':
          description: 'See Other (redirect). Location: `/pay` — a redirect back to the payment page'
          headers:
            Location:
              $ref: '#/components/headers/Location'
  /action/close:
    post:
      tags:
      - AuthResource
      summary: Carries out a close the closing page asked the operator to justify (LC-01-02-02/06/10).
      operationId: AuthResource_closeRegister
      description: |-
        Carries out a close the closing page asked the operator to justify (LC-01-02-02/06/10).

        Two ways through, and they are not the same event. The OPERATOR keys their own password; a SUPERVISOR endorses a forced close, which is what the requirement asks for when the password is forgotten, and which the journal records as a forcing.

        Java: `AuthResource#closeRegister` — returns `Response`. `@DrawerMayBeOpen` (reachable while the cash drawer is open).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: the operator's password, or null on a forced close
                supervisor:
                  type: string
                  description: the supervisor's identifier on a forced close
                supervisorPassword:
                  type: string
                  description: the supervisor's password on a forced close
      responses:
        '200':
          description: OK — a redirect to the lock screen, or the page again with its refusal
          content:
            text/html:
              schema:
                type: string
        '303':
          description: 'See Other (redirect). Location: `/lock`'
          headers:
            Location:
              $ref: '#/components/headers/Location'
  /action/collect:
    get:
      tags:
      - HomeResource
      summary: Marks the selected line "à enlever", or arms the next article for it (`LC-02-08-01/02/03`).
      operationId: HomeResource_toggleCollect
      description: |-
        Marks the selected line "à enlever", or arms the next article for it (`LC-02-08-01/02/03`).

        Java: `HomeResource#toggleCollect` — returns `TemplateInstance`. `@DrawerMustBeClosed` (redirects to `/drawer-error` while the cash drawer is open).
      responses:
        '200':
          description: HTML page rendered by a Qute template. the home page
          content:
            text/html:
              schema:
                type: string
  /action/credit-authorize:
    post:
      tags:
      - PaymentResource
      summary: Lets a supervisor allow the account's ceiling to be passed (LC-07-09-04).
      operationId: PaymentResource_authorizeCreditOverLimit
      description: |-
        Lets a supervisor allow the account's ceiling to be passed (LC-07-09-04).

        Java: `PaymentResource#authorizeCreditOverLimit` — returns `Response`. `@DrawerMustBeClosed` (redirects to `/drawer-error` while the cash drawer is open).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                login:
                  type: string
