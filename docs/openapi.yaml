        Deliberate escape hatch for commissioning, demonstration and a till whose faulty peripheral must not stop the day: the failure is real and stays reported, but the operator decides. It requires an unlocked register — the credentials were checked by `#unlock` just before and the gate does not log the operator out — so the page cannot be used as a way in; a stale page posted after a lockout goes back to the lock screen. The bypass is journalled at WARN, otherwise a till would end up selling for weeks with a dead printer nobody remembers.

        Java: `AuthResource#hardwareOverride` — returns `Response`. `@DrawerMayBeOpen` (reachable while the cash drawer is open).
