  /api/hardware/catalog:
    get:
      tags:
      - MockHardwareResource
      summary: What the register CURRENTLY knows how to sell, for the simulator's article lists.
      operationId: MockHardwareResource_catalog
      x-build-profile: only in build profile(s) `dev`, `test`
      description: |-
        What the register CURRENTLY knows how to sell, for the simulator's article lists.

        The simulator used to carry those lists written by hand, and they were true of exactly one catalogue: the referential seed. A register is fed by its store node, and the node's own feed carries another numbering plan entirely — so every list went stale the day the demonstration started going through the node, and each scan came back "CODE INCONNU" without the operator being able to see why. A hand-kept mirror of a table that another machine replaces cannot be kept right; the only list that is never wrong is the one read off the register at the moment of the scan.

        The filter is the one the scan itself applies — `active = true` — so what this answers is exactly what a scan will accept. An article forbidden to sale IS listed: refusing it is one of the cases worth demonstrating, and the flag is carried so the screen can say so.

        Java: `MockHardwareResource#catalog` — returns `Response`. Exists only in build profile(s) `dev`, `test`.
      parameters:
      - name: limit
        in: query
        description: how many articles at most (bounded to 500)
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK — the sellable articles as JSON, EAN, label, PLU and the forbidden flag, in catalogue order
          content:
            application/json:
              schema:
                type: object
