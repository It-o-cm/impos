      operationId: AuthResource_closePage
      description: |-
        Closes the register, or shows what stands in the way (LC-01-02-01).

        A GET, because it is reached from a key on the sale screen; it either closes straight away — the historical behaviour, and still the default — or renders the page that asks for what the back office demanded.

        Reached the other way too: the operator scans their own badge and the sale screen sends them here. The badge IS the credential, so it answers the password the back office may demand (LC-01-02-03) — and only that. Tickets left in attente still stop the close and still ask for the supervisor's endorsement, because that question is not about proving who is standing at the register.

        Java: `AuthResource#closePage` — returns `Response`. `@DrawerMayBeOpen` (reachable while the cash drawer is open).
